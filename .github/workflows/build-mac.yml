# CI Mac build - Phase 1 of the release-pipeline plan.
# (Plan lives outside the repo in /Users/andy/.opencode/plan - pro/free build
# details stay private.)
#
# Triggers on pre-* tags + manual dispatch only. Stable Mac releases stay local
# (../ogl2/bin/buildmac.sh + manual upload to Releases) until this CI-built
# .app passes the Gatekeeper/quarantine-trick test.
#
# No Apple Developer license: the .app is ad-hoc signed only. Users run the
# bundled fix-permissions.command (right-click > Open) after unzipping.
#
# Sibling pins `ref: 2026-dustoff` are TEMPORARY - drop them once the
# 2026-dustoff branches are merged to main/master. (pynsource-rego has no
# such branch, so it tracks its default.)
name: Pynsource app built on mac
on:
  push:
    tags: ['pre-*']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14  # arm64; single-arch until Intel story is decided
    steps:
    - name: Check out pynsource (triggering ref)
      uses: actions/checkout@v4
      with:
        path: pynsource/

    - name: Check out ogl2 (private, branch pin - see header)
      uses: actions/checkout@v4
      with:
        repository: abulka/ogl2
        ref: 2026-dustoff
        token: ${{ secrets.my_pat }}
        path: ogl2/

    - name: Check out pynsource-rego (private)
      uses: actions/checkout@v4
      with:
        repository: abulka/pynsource-rego
        token: ${{ secrets.my_pat }}
        path: pynsource-rego/

    - name: Check out ALSM (private, branch pin - see header)
      uses: actions/checkout@v4
      with:
        repository: abulka/alsm
        ref: 2026-dustoff
        token: ${{ secrets.my_pat }}
        path: alsm/

    - name: Setup uv (python-build-standalone interpreter - see the next step)
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: false

    - name: Build interpreter + venv (python-build-standalone, NOT setup-python)
      shell: bash
      env:
        # Never fall back to a framework interpreter: framework Python + wxasync's
        # macOS event loop stalls the wx event pump for the whole duration of a
        # mouse drag (frozen canvas). uv's Python is a shared-libpython build and
        # is measured fast. See BUG-DIST-SLOWNESS-MAC.md.
        UV_PYTHON_PREFERENCE: only-managed
      run: |
        uv python install 3.13
        uv venv --python 3.13 --python-preference only-managed .venv
        # make this venv the default python/pyinstaller for all later steps
        echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
        uv pip install --python .venv/bin/python wheel wxpython pyinstaller
        uv pip install --python .venv/bin/python -r pynsource/requirements.txt
        uv pip install --python .venv/bin/python alsm/
        .venv/bin/python -c "import sys, wx; print('BUILD PYTHON', sys.version.split()[0], 'framework=', repr(sys._framework), wx.version())"

    - name: Build executable using Pyinstaller
      shell: bash
      run: |
        cd pynsource/
        python bin/_buildsamples.py
        pyinstaller --noconfirm ../ogl2/bin/pynsource-github-actions.spec
        cp README.md dist/Readme.txt
        cp CHANGELOG.md dist/Changelog.txt
        cp .deploy-extras/macos/fix-permissions.command dist/
        cp .deploy-extras/macos/IMPORTANT-README-BEFORE-RUNNING.txt dist/
        # The bare exe is useless on Mac, just want the .app (it was needed for the app phase)
        rm -f dist/Pynsource
        ls -l dist/

    - name: Guard - the bundled interpreter must not be a framework build
      shell: bash
      run: |
        exe=pynsource/dist/Pynsource.app/Contents/MacOS/Pynsource
        listing=$(.venv/bin/pyi-archive_viewer -l "$exe" | grep -E "libpython3|Python\.framework/Versions/[^ ]+/Python" || true)
        echo "$listing"
        if echo "$listing" | grep -q "Python.framework"; then
          echo "::error::bundled interpreter is a framework Python - the wxasync drag freeze will be back (see BUG-DIST-SLOWNESS-MAC.md)"
          exit 1
        fi
        echo "$listing" | grep -q "libpython3" || { echo "::error::no bundled libpython3 found"; exit 1; }

    - name: Get the tag name
      shell: bash
      run: |
        if [[ "$GITHUB_REF" == refs/tags/* ]]; then
          echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
        else
          # Manual dispatch: branch name + run number, slashes sanitized
          echo "TAG=${GITHUB_REF_NAME//\//-}-${GITHUB_RUN_NUMBER}" >> $GITHUB_ENV
        fi

    - name: Zip the app bundle
      shell: bash
      run: |
        cd pynsource/dist
        zip -r pynsource-macos-${{ env.TAG }}.zip Pynsource.app Readme.txt Changelog.txt fix-permissions.command IMPORTANT-README-BEFORE-RUNNING.txt

    - name: Save app bundle as artifact
      uses: actions/upload-artifact@v4
      with:
        name: pynsource-macos-${{ env.TAG }}
        path: pynsource/dist/

    - name: Draft pre-release
      if: startsWith(env.TAG, 'pre-')
      uses: softprops/action-gh-release@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        draft: true
        files: pynsource/dist/pynsource-macos-${{ env.TAG }}.zip
