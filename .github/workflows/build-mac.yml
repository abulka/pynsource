# CI Mac build - Phase 1 of the release-pipeline plan.
# (Plan lives outside the repo in /Users/andy/.opencode/plan - pro/free build
# details stay private.)
#
# Triggers on pre-* and version-* tags + manual dispatch. A tag creates (or adds to) a DRAFT
# release, which is published by hand once every platform's asset is attached; the same
# workflows replace the local build scripts, no manual upload any more.
#
# No Apple Developer license: the .app is ad-hoc signed only. Users run the
# unzip, then follow the "Open Anyway" steps in IMPORTANT-README-BEFORE-RUNNING.txt.
#
# Siblings (wxdiagram, pynsource-rego, alsm): wxdiagram is the public canvas
# library and can be overridden from workflow_dispatch; the other two are private.
name: Pynsource app built on mac
on:
  push:
    tags: ['pre-*', 'version-*']
  workflow_dispatch:
    inputs:
      wxdiagram_ref:
        description: wxdiagram git ref to build against
        required: false
        default: main

jobs:
  build:
    # macos-15 = arm64 standard runner. macos-14 was retired by GitHub on 2026-11-02
    # ("The configuration 'macos-14-arm64-us-default' is not supported"), which fails the
    # job in 1s before any step runs. Single-arch until the Intel story is decided.
    runs-on: macos-15
    steps:
    - name: Check out pynsource (triggering ref)
      uses: actions/checkout@v5
      with:
        path: pynsource/

    - name: Check out wxdiagram (public canvas library)
      uses: actions/checkout@v5
      with:
        repository: abulka/wxdiagram
        ref: ${{ inputs.wxdiagram_ref || 'main' }}
        path: wxdiagram/

    - name: Check out pynsource-rego (private)
      uses: actions/checkout@v5
      with:
        repository: abulka/pynsource-rego
        token: ${{ secrets.my_pat }}
        path: pynsource-rego/

    - name: Check out ALSM (private, default branch - see header)
      uses: actions/checkout@v5
      with:
        repository: abulka/alsm
        token: ${{ secrets.my_pat }}
        path: alsm/

    - name: Setup uv (python-build-standalone interpreter - see the next step)
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: false

    - name: Build interpreter + venv (python-build-standalone, NOT setup-python)
      shell: bash
      env:
        # Never fall back to a framework interpreter: framework Python + wxasync's
        # macOS event loop stalls the wx event pump for the whole duration of a
        # mouse drag (frozen canvas). uv's Python is a shared-libpython build and
        # is measured fast. See Admin/BUG-DIST-SLOWNESS-MAC.md.
        UV_PYTHON_PREFERENCE: only-managed
      run: |
        uv python install 3.13
        uv venv --python 3.13 --python-preference only-managed .venv
        # make this venv the default python/pyinstaller for all later steps
        echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
        uv pip install --python .venv/bin/python wheel wxpython pyinstaller
        uv pip install --python .venv/bin/python -e wxdiagram/
        uv pip install --python .venv/bin/python -r pynsource/requirements.txt
        uv pip install --python .venv/bin/python alsm/
        .venv/bin/python -c "import sys, wx; print('BUILD PYTHON', sys.version.split()[0], 'framework=', repr(sys._framework), wx.version())"

    - name: Build executable using Pyinstaller
      shell: bash
      run: |
        cd pynsource/
        python buildtools/buildsamples.py
        pyinstaller --noconfirm buildtools/pynsource.spec
        cp README.md dist/Readme.txt
        cp CHANGELOG.md dist/Changelog.txt
        cp .deploy-extras/macos/IMPORTANT-README-BEFORE-RUNNING.txt dist/
        # onedir: dist/Pynsource/ is the COLLECT directory (duplicate of what's inside the
        # .app) - we only ship the .app, and uploading both would double the artifact size
        rm -rf dist/Pynsource
        ls -l dist/
        du -sh dist/Pynsource.app

    - name: Guard - onedir layout, and a non-framework bundled interpreter
      shell: bash
      run: |
        app=pynsource/dist/Pynsource.app
        [ -d "$app/Contents/MacOS" ] || { echo "::error::no Pynsource.app produced"; exit 1; }
        # onedir expected: payload in Contents/Frameworks (onefile would put it in the exe)
        [ -d "$app/Contents/Frameworks" ] || { echo "::error::Contents/Frameworks missing - did the spec revert to onefile? (PyInstaller 7 rejects onefile+.app)"; exit 1; }
        lib=$(find "$app" -name 'libpython3*.dylib' | head -5)
        fw=$(find "$app" -name 'Python.framework' | head -5)
        echo "libpython: $lib"
        echo "framework: $fw"
        [ -n "$lib" ] || { echo "::error::no bundled libpython3 found"; exit 1; }
        if [ -n "$fw" ]; then
          echo "::error::bundled interpreter is a framework Python - the wxasync drag freeze will be back (see Admin/BUG-DIST-SLOWNESS-MAC.md)"
          exit 1
        fi
        codesign --verify --deep --strict "$app" && echo "codesign verify OK"

    - name: Get the tag name
      shell: bash
      run: |
        if [[ "$GITHUB_REF" == refs/tags/* ]]; then
          echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
        else
          # Manual dispatch: branch name + run number, slashes sanitized
          echo "TAG=${GITHUB_REF_NAME//\//-}-${GITHUB_RUN_NUMBER}" >> $GITHUB_ENV
        fi

    - name: Zip the app bundle
      shell: bash
      run: |
        cd pynsource/dist
        # -y keeps the Contents/Resources symlinks as symlinks; without it zip stores the
        # whole payload twice (83MB instead of 35MB)
        zip -r -y pynsource-macos-${{ env.TAG }}.zip Pynsource.app Readme.txt Changelog.txt IMPORTANT-README-BEFORE-RUNNING.txt
        ls -l pynsource-macos-${{ env.TAG }}.zip

    - name: Save app bundle as artifact
      uses: actions/upload-artifact@v6
      with:
        name: pynsource-macos-${{ env.TAG }}
        path: pynsource/dist/

    - name: Draft release (published by hand)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v3
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        draft: true
        # one shared body for every OS: Mac and Windows workflows both write this file,
        # so it no longer matters which of them finishes last
        body_path: pynsource/.deploy-extras/RELEASE-NOTES.md
        files: pynsource/dist/pynsource-macos-${{ env.TAG }}.zip
