# Snap build - Phase 5 of the release-pipeline plan.
#
# This workflow was dead: it used actions/upload-artifact@v3, which GitHub now rejects
# before any step runs ("automatically failed because it uses a deprecated version"), so it
# had not produced a snap since 2024.
#
# It builds with `snapcraft pack --destructive-mode` instead of a build action: no LXD
# machinery, no third-party action to fall out of date, and the runner image matches the
# base (ubuntu-24.04 <-> core24).
#
# Channel policy (see the plan): edge only, on pre-* tags. Stable is promoted by hand in the
# store UI after a snap has actually been installed and run.
#
# The edge upload needs the SNAPCRAFT_STORE_CREDENTIALS secret, which is an *exported login*
# with an expiry date. When it lapses the build and the install test still pass and only this
# step fails ("Exported credentials are no longer valid for the Snap Store"); re-export with
#   snapcraft export-login --snaps pynsource --channels edge,candidate,stable -
# and `gh secret set SNAPCRAFT_STORE_CREDENTIALS`.
name: Pynsource Snap
on:
  push:
    tags: ['pre-*']
    # TEMPORARY - scratch branch used to iterate before the workflow exists on
    # the default branch (workflow_dispatch needs that). Removed before merge.

  workflow_dispatch:

jobs:
  build:
    # Both arches are built natively: snapcraft cannot cross-compile wxPython, and there is no
    # arm64 wx wheel anywhere (PyPI has none for Linux at all, extras.wxpython.org is x86_64).
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    name: snap ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    env:
      TAG: ${{ github.ref_name }}
      # "ci/snap" (branch) is not a valid artifact name
      TAG_SLUG: ${{ github.ref_name }}
    steps:
    - name: Sanitise the tag for artifact names
      run: echo "TAG_SLUG=${TAG//\//-}" >> "$GITHUB_ENV"

    - name: Check out pynsource (triggering ref)
      uses: actions/checkout@v4
      with:
        # `version: git` in snapcraft.yaml runs git describe: a shallow clone has no tags
        # and silently produced version "0+git.98c57e6" in the store
        fetch-depth: 0

    # Linux is Pro-free (src/gui/settings.py), so the snap must carry the Pro-only packages:
    # ogl2 (canvas: zoom, drag-to-connect) and alsm (module visualisation). They are separate
    # private repos, checked out into the project dir so the snapcraft part can pip install them.
    - name: Check out ogl2 (private, branch pin)
      uses: actions/checkout@v4
      with:
        repository: abulka/ogl2
        ref: 2026-dustoff
        token: ${{ secrets.my_pat }}
        path: ogl2/

    - name: Check out ALSM (private, branch pin)
      uses: actions/checkout@v4
      with:
        repository: abulka/alsm
        ref: 2026-dustoff
        token: ${{ secrets.my_pat }}
        path: alsm/

    # `version: git` = git describe, which reports the nearest *older* tag
    # ("pre-2026-dustoff-6+git13.86bdd0a") and, on a shallow clone, "0+git.<sha>". Set it from
    # the ref instead so the store listing always matches the release it came from.
    - name: Set the snap version from the ref
      run: |
        if [[ "$GITHUB_REF" == refs/tags/* ]]; then
          version="${GITHUB_REF#refs/tags/}"
        else
          version="dev-${GITHUB_SHA:0:7}"
        fi
        sed -i "s/^version: git$/version: \"$version\"/" snap/snapcraft.yaml
        grep -E '^version:' snap/snapcraft.yaml
        echo "SNAP_VERSION=$version" >> "$GITHUB_ENV"

    - name: Install snapcraft
      run: |
        sudo snap install snapcraft --classic
        snapcraft --version

    - name: Build the snap (destructive mode - the runner is the build environment)
      run: |
        sudo snapcraft pack --destructive-mode --verbosity=brief --build-for=${{ matrix.arch }}
        ls -l *.snap
        file *.snap | head -2

    - name: Show the snap's version and confinement
      run: |
        # read the metadata straight out of the packed snap (a squashfs); no store round-trip
        sudo apt-get install -y -qq squashfs-tools >/dev/null
        unsquashfs -cat "$(ls *.snap)" meta/snap.yaml | head -20
        du -h *.snap

    - name: Save the snap as an artifact
      uses: actions/upload-artifact@v4
      with:
        # a branch ref can be "ci/snap", and a slash is not allowed in an artifact name
        name: pynsource-snap-${{ matrix.arch }}-${{ env.TAG_SLUG }}
        path: '*.snap'

    # The point of a snap is that it runs on a stock Ubuntu, so actually install it here.
    # Whatever the CLI prints is evidence the PYTHONPATH/entry-point wiring is right.
    # The point of a snap is that it installs and runs on a stock Ubuntu, so do that here.
    # The CLI proves the PYTHONPATH/entry-point wiring; a missing alsm would leave Linux
    # users without module visualisation, so that is a hard failure too.
    - name: Install the snap and run the CLI
      run: |
        sudo snap install --dangerous "$(ls *.snap)"
        snap list pynsource
        # qualified form: the app is "pynsource-cli" inside the "pynsource" snap
        # the snap just built is for this runner's architecture, so installing it is valid
        out=$(snap run pynsource.pynsource-cli --version 2>&1)
        echo "$out"
        echo "$out" | grep -q "Pynsource CLI version" || { echo "::error::CLI did not report a version"; exit 1; }
        if echo "$out" | grep -q "could not be enabled"; then
          # settings.py catches only ModuleNotFoundError, so a missing alsm *dependency* also
          # reads as "alsm not installed" - print the real traceback before failing
          snap run --shell pynsource.pynsource-cli -c '/usr/bin/python3 -c "import alsm"' || true
          echo "::error::alsm is missing - Pro module visualisation would be disabled on Linux"
          exit 1
        fi

    - name: Push to edge
      if: startsWith(github.ref, 'refs/tags/pre-')
      env:
        SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.snapcraft_store_credentials }}
      run: snapcraft upload *.snap --release edge
