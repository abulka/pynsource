name: pynsource
title: Pynsource
version: git
summary: 'Pynsource - reverse engineer Python source code into UML'
description: |
      UML tool for Python. Reverse engineer Python source code into UML.
      Requires a GTK3 desktop (the gnome extension provides it).

grade: stable # devel # must be 'stable' to release into candidate/stable channels
confinement: strict # devmode # strict is the goal; all Pro features are free on Linux,
                    # so there is no licence file to write outside the sandbox
base: core24

# core24 wants `platforms:` (the old `architectures:` key is deprecated). amd64 only for now:
# the wxPython wheel below is x86_64, and an arm64 snap needs a remote/arm build.
platforms:
  amd64:

apps:
  # Once built and installed, you can also run with /snap/bin/pynsource. (hit TAB to autocomplete)
  pynsource:
    command: bin/pynsource
    extensions:
      # HINT: Adds plugs and changes environment variables when building and running
      - gnome
    plugs:
      - desktop
      - desktop-legacy
      - x11
      - wayland
      - gsettings
      - home
      - network
      - network-bind
      - removable-media
    desktop: usr/share/applications/pynsource.desktop
  pynsource-cli:
    command: bin/pynsource-cli
    plugs:
      - home
      - network
      - network-bind
      - removable-media

parts:
  copy-media:
    plugin: dump
    source: src/media
    # core24 = Python 3.12 (this used to be hardcoded to lib/python3.10)
    organize:
      "*": lib/python3.12/site-packages/media/

  # To get the HelpWindow.html and the help-images folder into the snap
  copy-dialogs:
    plugin: dump
    source: src/dialogs/
    organize:
      "*": lib/python3.12/site-packages/dialogs/

  build-the-python-stuff-please:
    plugin: python
    source: .
    build-packages:
      - libsdl2-dev
    stage-packages:
      - libsdl2-2.0-0
    python-requirements:
      # requirements-snap.txt pulls in requirements-linux-common.txt (relatively) and pins
      # wxPython to the cp312 wheel built for ubuntu-24.04 - there are no Linux wheels on PyPI
      - .requirement-extras/requirements-snap.txt
    # NOTE: the gnome extension exports PYTHONPATH pointing at the gnome-46-2404-sdk snap, whose
    # pip is broken ("cannot import name 'cli' from 'pip._internal.cli.main'"). unset in the
    # override below so the python plugin's pip comes from the core24 base instead.
    override-build: |
      # see the note above: the gnome SDK's broken pip must not be picked up
      unset PYTHONPATH
      # this .desktop file ends up in /var/lib/snapd/desktop/applications/pynsource_pynsource.desktop
      # not the usual /usr/share/applications
      install -Dm644 "snap/gui/pynsource.desktop" -t "$CRAFT_PART_INSTALL/usr/share/applications/"
      craftctl default
