name: pynsource
title: Pynsource
version: git
summary: 'Pynsource - reverse engineer Python source code into UML'
description: |
      UML tool for Python. Reverse engineer Python source code into UML.
      Requires a GTK3 desktop (the gnome extension provides it).
contact: https://github.com/abulka/pynsource/issues
license: MIT
website: https://www.pynsource.com/
source-code: https://github.com/abulka/pynsource
issues: https://github.com/abulka/pynsource/issues
icon: snap/gui/pynsource.png

grade: stable # devel # must be 'stable' to release into candidate/stable channels
confinement: strict # devmode # strict is the goal; all Pro features are free on Linux,
                    # so there is no licence file to write outside the sandbox
base: core24

# core24 wants `platforms:` (the old `architectures:` key is deprecated). amd64 only for now:
# the wxPython wheel below is x86_64, and an arm64 snap needs a remote/arm build.
platforms:
  amd64:

apps:
  # Once built and installed, you can also run with /snap/bin/pynsource. (hit TAB to autocomplete)
  pynsource:
    command: usr/bin/pynsource
    environment:
      # the python part installs under usr/, which core24's python does not search by default
      PYTHONPATH: $SNAP/usr/lib/python3.12/site-packages
    extensions:
      # HINT: Adds plugs and changes environment variables when building and running
      - gnome
    plugs:
      - desktop
      - desktop-legacy
      - x11
      - wayland
      - gsettings
      - home
      - network
      - network-bind
      - removable-media
    desktop: usr/share/applications/pynsource.desktop
  pynsource-cli:
    command: usr/bin/pynsource-cli
    environment:
      PYTHONPATH: $SNAP/usr/lib/python3.12/site-packages
    plugs:
      - home
      - network
      - network-bind
      - removable-media

parts:
  copy-media:
    plugin: dump
    source: src/media
    # core24 = Python 3.12 (this used to be hardcoded to lib/python3.10)
    organize:
      "*": usr/lib/python3.12/site-packages/media/

  # To get the HelpWindow.html and the help-images folder into the snap
  copy-dialogs:
    plugin: dump
    source: src/dialogs/
    organize:
      "*": usr/lib/python3.12/site-packages/dialogs/

  # Deliberately not `plugin: python`: on core24 that plugin (python_v2) refuses /usr/bin/python3
  # and takes pip from $PATH, which the gnome extension points at the gnome-46-2404-sdk snap -
  # whose pip is broken ("cannot import name 'cli' from 'pip._internal.cli.main'"). Doing the
  # install by hand against the base interpreter is boring, but predictable.
  pynsource:
    plugin: nil
    source: .
    build-packages:
      - python3-pip
      - libsdl2-dev
    stage-packages:
      - libsdl2-2.0-0
    override-build: |
      unset PYTHONPATH
      # this .desktop file ends up in /var/lib/snapd/desktop/applications/pynsource_pynsource.desktop
      # not the usual /usr/share/applications
      install -Dm644 "snap/gui/pynsource.desktop" -t "$CRAFT_PART_INSTALL/usr/share/applications/"

      # --target rather than --prefix: Debian's python uses the `posix_local` sysconfig scheme,
      # so --prefix silently puts scripts in usr/local/bin and modules in usr/local/lib.
      SITE="$CRAFT_PART_INSTALL/usr/lib/python3.12/site-packages"
      # requirements-snap.txt pulls in requirements-linux-common.txt and pins wxPython to the
      # cp312 wheel built for ubuntu-24.04 - there are no Linux wheels on PyPI at all
      /usr/bin/python3 -m pip install --target "$SITE" --no-warn-script-location \
        -r .requirement-extras/requirements-snap.txt
      /usr/bin/python3 -m pip install --target "$SITE" --no-warn-script-location --no-deps .

      # console scripts by hand (no setuptools entry points to fight over): the app definition
      # puts $SNAP/usr/lib/python3.12/site-packages on PYTHONPATH, so `-m` just works
      install -d "$CRAFT_PART_INSTALL/usr/bin"
      # run(), not `-m pynsource_gui`: the module's __main__ block is debug scaffolding
      printf '#!/bin/sh\nexec /usr/bin/python3 -c "from pynsource_gui import run; run()" "$@"\n' \
        > "$CRAFT_PART_INSTALL/usr/bin/pynsource"
      printf '#!/bin/sh\nexec /usr/bin/python3 -c "from pynsource_cli import reverse_engineer; reverse_engineer()" "$@"\n' \
        > "$CRAFT_PART_INSTALL/usr/bin/pynsource-cli"
      chmod +x "$CRAFT_PART_INSTALL/usr/bin/pynsource" "$CRAFT_PART_INSTALL/usr/bin/pynsource-cli"

      ls -l "$CRAFT_PART_INSTALL/usr/bin" "$SITE" | head -20
