name: pynsource
title: Pynsource
version: git
summary: 'Pynsource - reverse engineer Python source code into UML'
description: |
      UML tool for Python. Reverse engineer Python source code into UML.
      Requires a GTK3 desktop (the gnome extension provides it).
contact: https://github.com/abulka/pynsource/issues
license: MIT
website: https://www.pynsource.com/
source-code: https://github.com/abulka/pynsource
issues: https://github.com/abulka/pynsource/issues
icon: snap/gui/pynsource.png

grade: stable # devel # must be 'stable' to release into candidate/stable channels
confinement: strict # devmode # strict is the goal; all Pro features are free on Linux,
                    # so there is no licence file to write outside the sandbox
base: core24

# core24 wants `platforms:` (the old `architectures:` key is deprecated). Both arches are built
# natively by CI: ubuntu-24.04 for amd64, ubuntu-24.04-arm for arm64 (snapcraft cannot
# cross-compile wxPython).
platforms:
  amd64:
  arm64:

apps:
  # Once built and installed, you can also run with /snap/bin/pynsource. (hit TAB to autocomplete)
  pynsource:
    command: usr/bin/pynsource
    environment:
      # the python part installs under usr/, which core24's python does not search by default
      PYTHONPATH: $SNAP/usr/lib/python3.12/site-packages
    extensions:
      # HINT: Adds plugs and changes environment variables when building and running
      - gnome
    plugs:
      - desktop
      - desktop-legacy
      - x11
      - wayland
      - gsettings
      - home
      - network
      - network-bind
      - removable-media
    desktop: usr/share/applications/pynsource.desktop
  pynsource-cli:
    command: usr/bin/pynsource-cli
    environment:
      PYTHONPATH: $SNAP/usr/lib/python3.12/site-packages
    plugs:
      - home
      - network
      - network-bind
      - removable-media

parts:
  copy-media:
    plugin: dump
    source: src/media
    # core24 = Python 3.12 (this used to be hardcoded to lib/python3.10)
    organize:
      "*": usr/lib/python3.12/site-packages/media/

  # To get the HelpWindow.html and the help-images folder into the snap
  copy-dialogs:
    plugin: dump
    source: src/dialogs/
    organize:
      "*": usr/lib/python3.12/site-packages/dialogs/

  # Deliberately not `plugin: python`: on core24 that plugin (python_v2) refuses /usr/bin/python3
  # and takes pip from $PATH, which the gnome extension points at the gnome-46-2404-sdk snap -
  # whose pip is broken ("cannot import name 'cli' from 'pip._internal.cli.main'"). Doing the
  # install by hand against the base interpreter is boring, but predictable.
  pynsource:
    plugin: nil
    source: .
    build-packages:
      - python3-pip
      - libsdl2-dev
      # only needed to compile wxPython on arm64, but apt-installing them on amd64 costs a
      # minute and they are build-only (not staged into the snap)
      - build-essential
      - pkg-config
      - libgtk-3-dev
      - libnotify-dev
      - libjpeg-dev
      - libtiff-dev
      - libpng-dev
      - libgl1-mesa-dev
      - libglu1-mesa-dev
      - libsm-dev
      - libxtst-dev
      - libsecret-1-dev
      - libpcre2-dev
    stage-packages:
      - libsdl2-2.0-0
    override-build: |
      unset PYTHONPATH
      # this .desktop file ends up in /var/lib/snapd/desktop/applications/pynsource_pynsource.desktop
      # not the usual /usr/share/applications
      install -Dm644 "snap/gui/pynsource.desktop" -t "$CRAFT_PART_INSTALL/usr/share/applications/"

      # --target rather than --prefix: Debian's python uses the `posix_local` sysconfig scheme,
      # so --prefix silently puts scripts in usr/local/bin and modules in usr/local/lib.
      SITE="$CRAFT_PART_INSTALL/usr/lib/python3.12/site-packages"

      # wxPython: no Linux wheels on PyPI. The extras server only builds x86_64, so amd64 takes
      # the prebuilt cp312 wheel and arm64 compiles 4.2.5 from source (~15 min).
      # CRAFT_ARCH_BUILD_FOR is set by snapcraft; `dpkg --print-architecture` is unreliable in
      # the part environment (it came back empty, so amd64 fell into the compile branch)
      ARCH="${CRAFT_ARCH_BUILD_FOR:-$(dpkg --print-architecture)}"
      echo "=== building for $ARCH"
      if [ "$ARCH" = "amd64" ]; then
        /usr/bin/python3 -m pip install --target "$SITE" --no-warn-script-location \
          "https://extras.wxpython.org/wxPython4/extras/linux/gtk3/ubuntu-24.04/wxpython-4.2.5-cp312-cp312-linux_x86_64.whl"
      else
        # wxWidgets' bundled nanosvg uses unqualified isnan(), which gcc 13 (core24) no longer
        # pulls in transitively: "error: 'isnan' was not declared in this scope". gcc 11 on
        # ubuntu-22.04 builds the same source fine, so make the declaration visible instead of
        # patching the vendored header.
        export CXXFLAGS="-include cmath ${CXXFLAGS:-}"
        MAX_JOBS=$(nproc) /usr/bin/python3 -m pip wheel --no-binary wxpython "wxpython==4.2.5" \
          -w /tmp/wxwheel || { echo "ERROR: wxPython failed to compile for $ARCH" >&2; exit 1; }
        ls -l /tmp/wxwheel
        /usr/bin/python3 -m pip install --target "$SITE" --no-warn-script-location /tmp/wxwheel/wxpython-*.whl
      fi

      /usr/bin/python3 -m pip install --target "$SITE" --no-warn-script-location \
        -r .requirement-extras/requirements-snap.txt
      /usr/bin/python3 -m pip install --target "$SITE" --no-warn-script-location --no-deps .
      # Pro is free on Linux, so the snap ships the Pro-only siblings. The workflow checks
      # them out next to this project; snapcraft's `source: .` copies them along.
      # with dependencies: alsm pulls antlr4/esprima/javalang/prettyprinter/... which its
      # modules import at load time (--no-deps leaves 'import alsm' failing at runtime)
      for sibling in ogl2 alsm; do
        if [ -d "$sibling" ]; then
          /usr/bin/python3 -m pip install --target "$SITE" --no-warn-script-location "./$sibling"
        else
          echo "ERROR: $sibling/ not present - the snap would ship without Pro features" >&2
          exit 1
        fi
      done

      # console scripts by hand (no setuptools entry points to fight over): the app definition
      # puts $SNAP/usr/lib/python3.12/site-packages on PYTHONPATH, so `-m` just works
      install -d "$CRAFT_PART_INSTALL/usr/bin"
      # run(), not `-m pynsource_gui`: the module's __main__ block is debug scaffolding
      printf '#!/bin/sh\nexec /usr/bin/python3 -c "from pynsource_gui import run; run()" "$@"\n' \
        > "$CRAFT_PART_INSTALL/usr/bin/pynsource"
      printf '#!/bin/sh\nexec /usr/bin/python3 -c "from pynsource_cli import reverse_engineer; reverse_engineer()" "$@"\n' \
        > "$CRAFT_PART_INSTALL/usr/bin/pynsource-cli"
      chmod +x "$CRAFT_PART_INSTALL/usr/bin/pynsource" "$CRAFT_PART_INSTALL/usr/bin/pynsource-cli"

      # the wx wheel ships unstripped shared objects (_core alone is ~179MB), which is most of a
      # 154MB snap; same fix as bin/build-appimage.sh
      find "$SITE" -type f \( -name '*.so' -o -name '*.so.*' \) -print0 |
        xargs -0 -r -n 20 strip --strip-unneeded 2>/dev/null || true

      ls -l "$CRAFT_PART_INSTALL/usr/bin" || true
      du -sh "$SITE"
